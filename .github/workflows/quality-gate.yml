name: quality-gate-wrapper

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call-company-quality-gate:
    uses: ${{ github.repository }}/.github/workflows/company-quality-gate.yml@${{ github.ref_name }}
    with:
      strict_mode: true
      generate_pdf: true
      run_truth_validation: true
      # stack: dotnet
    secrets: inherit
