name: quality-gate-wrapper

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call-company-quality-gate:
    uses: ./.github/workflows/company-quality-gate.yml
    with:
      strict_mode: true
      generate_pdf: true
      run_truth_validation: true
    secrets: inherit
    # Allow the workflow to complete even when gate says CHANGES_REQUIRED
    continue-on-error: true
