name: company-quality-gate

on:
  workflow_call:
    inputs:
      stack:
        description: "Optional stack override: dotnet | python | node"
        required: false
        type: string
      strict_mode:
        description: "Fail when critical evidence is missing"
        required: false
        type: boolean
        default: true
      generate_pdf:
        description: "Generate branded PDF reports"
        required: false
        type: boolean
        default: true
      run_truth_validation:
        description: "Run truth + comparison validation scripts"
        required: false
        type: boolean
        default: true
      configuration:
        description: ".NET build configuration"
        required: false
        type: string
        default: "Release"
    secrets:
      quality_gate_repo_token:
        required: false
    outputs:
      gate_decision:
        description: "Final gate decision"
        value: ${{ jobs.quality-gate.outputs.gate_decision }}
      report_quality:
        description: "FULL | PARTIAL | FALLBACK"
        value: ${{ jobs.quality-gate.outputs.report_quality }}
      artifacts_run_folder:
        description: "Run folder name under artifacts/"
        value: ${{ jobs.quality-gate.outputs.artifacts_run_folder }}

jobs:
  quality-gate:
    runs-on: windows-latest
    outputs:
      gate_decision: ${{ steps.extract.outputs.gate_decision }}
      report_quality: ${{ steps.extract.outputs.report_quality }}
      artifacts_run_folder: ${{ steps.extract.outputs.artifacts_run_folder }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.quality_gate_repo_token || github.token }}

      - name: Set PowerShell execution policy
        shell: pwsh
        run: Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope CurrentUser -Force

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install required tools
        shell: pwsh
        run: |
          choco install pandoc -y --no-progress
          choco install wkhtmltopdf -y --no-progress
          refreshenv

      - name: Verify required tools
        shell: pwsh
        run: |
          dotnet --version
          Write-Host "Pandoc check:"
          if (-not (Get-Command pandoc -ErrorAction SilentlyContinue)) {
            Write-Warning "pandoc not found - PDF generation will be skipped"
          } else {
            pandoc --version | Select-Object -First 1
          }

      - name: Run quality gate
        id: gate
        shell: pwsh
        run: |
          Write-Host "### MARKER_XYZ ###"
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          $scriptPath = "$env:GITHUB_WORKSPACE\scripts\run_quality_gate.ps1"
          if (-not (Test-Path $scriptPath)) {
            Write-Error "run_quality_gate.ps1 not found at $scriptPath"
            exit 1
          }
          Write-Host "Calling: $scriptPath -Configuration ${{ inputs.configuration }} -StrictMode:$${{ inputs.strict_mode }}"
          & $scriptPath `
            -Configuration "${{ inputs.configuration }}" `
            -StrictMode:$${{ inputs.strict_mode }} `
            -GeneratePdf:$${{ inputs.generate_pdf }}

      - name: Run truth validation
        if: ${{ inputs.run_truth_validation }}
        shell: pwsh
        run: |
          $scriptPath = "$env:GITHUB_WORKSPACE\scripts\quality-gate.ps1"
          if (-not (Test-Path $scriptPath)) {
            Write-Warning "quality-gate.ps1 not found - skipping truth validation"
            exit 0
          }
          $latest = Get-ChildItem "$env:GITHUB_WORKSPACE\artifacts" -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^\d{8}_\d{6}$' } |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $latest) {
            Write-Warning "No run folder found under artifacts - skipping truth validation"
            exit 0
          }
          Write-Host "Running truth validation on: $($latest.FullName)"
          & $scriptPath -RunFolderPath $latest.FullName

      - name: Run report vs truth comparison
        if: ${{ inputs.run_truth_validation }}
        shell: pwsh
        run: |
          $scriptPath = "$env:GITHUB_WORKSPACE\scripts\report-vs-truth.ps1"
          if (-not (Test-Path $scriptPath)) {
            Write-Warning "report-vs-truth.ps1 not found - skipping comparison"
            exit 0
          }
          $latest = Get-ChildItem "$env:GITHUB_WORKSPACE\artifacts" -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^\d{8}_\d{6}$' } |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $latest) {
            Write-Warning "No run folder found - skipping comparison"
            exit 0
          }
          Write-Host "Running comparison on: $($latest.FullName)"
          & $scriptPath -RunFolderPath $latest.FullName

      - name: Extract gate outputs
        id: extract
        if: always()
        shell: pwsh
        run: |
          $artifactsPath = "$env:GITHUB_WORKSPACE\artifacts"
          if (-not (Test-Path $artifactsPath)) {
            New-Item -ItemType Directory -Path $artifactsPath | Out-Null
          }
          $latest = Get-ChildItem $artifactsPath -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^\d{8}_\d{6}$' } |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $latest) {
            "gate_decision=CHANGES_REQUIRED" >> $env:GITHUB_OUTPUT
            "report_quality=FALLBACK" >> $env:GITHUB_OUTPUT
            "artifacts_run_folder=" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $metricsPath = Join-Path $latest.FullName "status\metrics.json"
          $gateDecision = "CHANGES_REQUIRED"
          $reportQuality = "FALLBACK"
          if (Test-Path $metricsPath) {
            $m = Get-Content $metricsPath -Raw | ConvertFrom-Json
            if ($m.gateDecision)  { $gateDecision  = [string]$m.gateDecision }
            if ($m.reportQuality) { $reportQuality = [string]$m.reportQuality }
          }
          "gate_decision=$gateDecision"       >> $env:GITHUB_OUTPUT
          "report_quality=$reportQuality"     >> $env:GITHUB_OUTPUT
          "artifacts_run_folder=$($latest.Name)" >> $env:GITHUB_OUTPUT

      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.quality_gate_repo_token || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GATE_DECISION: ${{ steps.extract.outputs.gate_decision }}
          REPORT_QUALITY: ${{ steps.extract.outputs.report_quality }}
          RUN_FOLDER: ${{ steps.extract.outputs.artifacts_run_folder }}
        run: |
          $metricsPath = "$env:GITHUB_WORKSPACE\artifacts\$env:RUN_FOLDER\status\metrics.json"
          $testTotal = "N/A"; $testPassed = "N/A"; $testFailed = "N/A"
          $coveragePct = "N/A"; $sarifErrors = "N/A"; $readinessIndex = "N/A"
          $failedTests = ""
          $m = $null

          if (Test-Path $metricsPath) {
            $m = Get-Content $metricsPath -Raw | ConvertFrom-Json
            $testTotal      = $m.testTotal
            $testPassed     = $m.testPassed
            $testFailed     = $m.testFailed
            $coveragePct    = "$($m.coveragePct)%"
            $sarifErrors    = $m.sarifErrors
            $readinessIndex = $m.readinessIndex
          }

          $testReportPath = "$env:GITHUB_WORKSPACE\artifacts\$env:RUN_FOLDER\reports\test-report.md"
          if (Test-Path $testReportPath) {
            $lines = Get-Content $testReportPath
            $inFailed = $false
            $failedList = @()
            foreach ($line in $lines) {
              if ($line -match "^## Failed Tests Detail") { $inFailed = $true; continue }
              if ($inFailed -and $line -match "^## ") { break }
              if ($inFailed -and $line -match "^- ") { $failedList += $line }
            }
            if ($failedList.Count -gt 0) { $failedTests = ($failedList | Select-Object -First 5) -join "`n" }
          }

          $icon         = if ($env:GATE_DECISION -eq "APPROVED_FOR_MERGE") { "✅" } else { "❌" }
          $coverageIcon = if ($m -and [double]$m.coveragePct -ge 60) { "✅" } else { "⚠️" }
          $testIcon     = if ($m -and [int]$m.testFailed -eq 0) { "✅" } else { "❌" }
          $staticIcon   = if ($m -and [int]$m.sarifErrors -eq 0) { "✅" } else { "❌" }

          $failedSection = if ($failedTests) { "### ❌ Failed Tests`n$failedTests`n" } else { "" }
          $mergeMsg = if ($env:GATE_DECISION -eq "APPROVED_FOR_MERGE") {
            "**All checks passed. This PR is ready to merge.**"
          } else {
            "**This PR has issues that should be resolved before merging. Download the full reports from the Actions artifacts for details.**"
          }

          $body = @"
          ## $icon Quality Gate — $env:GATE_DECISION

          | Metric | Value |
          | --- | --- |
          | Report Quality | $env:REPORT_QUALITY |
          | Readiness Index | $readinessIndex / 100 |
          | $testIcon Tests | $testPassed passed, $testFailed failed (total: $testTotal) |
          | $coverageIcon Line Coverage | $coveragePct (threshold: 60%) |
          | $staticIcon SARIF Errors | $sarifErrors |

          $failedSection
          ### Merge Readiness
          $mergeMsg

          ---
          *Quality gate run: ``$env:RUN_FOLDER`` | [View full run]($env:GITHUB_SERVER_URL/$env:REPO/actions/runs/$env:GITHUB_RUN_ID)*
          "@

          $body = ($body -split "`n" | ForEach-Object { $_.TrimStart() }) -join "`n"

          $payload = @{ body = $body } | ConvertTo-Json -Compress
          $uri = "https://api.github.com/repos/$env:REPO/issues/$env:PR_NUMBER/comments"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept        = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          try {
            Invoke-RestMethod -Uri $uri -Method Post -Headers $headers -Body $payload -ContentType "application/json"
            Write-Host "[gate] PR comment posted successfully."
          }
          catch {
            Write-Warning "[gate] Failed to post PR comment: $($_.Exception.Message)"
          }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-artifacts-${{ github.run_id }}
          path: ${{ github.workspace }}/artifacts/**
          if-no-files-found: warn
